# Android builds are published as workflow artifacts for the checked-out revision.
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_NAME: WealthCrescent-debug-apk
  RELEASE_ARTIFACT_NAME: WealthCrescent-release-apk
  RELEASE_AAB_ARTIFACT_NAME: WealthCrescent-release-aab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Secrets can't be read directly in an `if:` conditional (GitHub Actions
      # limitation), so this step evaluates them in a shell (where they CAN be
      # substituted, same as any other secret consumption) and exposes a plain
      # true/false step output that later `if:` conditions key off instead.
      - name: Check for release signing secrets
        if: github.event_name != 'pull_request'
        id: signing_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug :native-app:assembleDebug --no-daemon

      - name: Locate built debug APK
        id: locate
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK found under android/app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "Built: $apk"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload native preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WealthCrescent-native-preview-apk
          path: android/native-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: steps.signing_check.outputs.has_signing == 'true'
        id: decode_keystore
        run: |
          keystore_path="$RUNNER_TEMP/release.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build release APK + AAB
        if: steps.signing_check.outputs.has_signing == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Falls back to ANDROID_KEYSTORE_PASSWORD in build.gradle.kts if this secret
          # isn't set — real PKCS12 keystores (including this app's) don't support a
          # separate key password, so this secret is optional.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Locate built release APK + AAB
        if: steps.signing_check.outputs.has_signing == 'true'
        id: locate_release
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n1)
          if [ -z "$apk" ]; then
            echo "No release APK found under android/app/build/outputs/apk/release" >&2
            exit 1
          fi
          if [ -z "$aab" ]; then
            echo "No release AAB found under android/app/build/outputs/bundle/release" >&2
            exit 1
          fi
          echo "Built: $apk"
          echo "Built: $aab"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab" >> "$GITHUB_OUTPUT"

      - name: Upload release build artifacts
        if: steps.signing_check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ steps.locate_release.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload release AAB artifact (for manual Play Console upload)
        if: steps.signing_check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_AAB_ARTIFACT_NAME }}
          path: ${{ steps.locate_release.outputs.aab_path }}
          if-no-files-found: error

      - name: Get signing certificate fingerprint
        if: steps.signing_check.outputs.has_signing == 'true'

        run: |
          fp=$(keytool -list -v \
            -keystore "${{ steps.decode_keystore.outputs.keystore_path }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            2>/dev/null | grep 'SHA256:' | head -n1 | sed 's/^[[:space:]]*//')
          echo "sha256=$fp" >> "$GITHUB_OUTPUT"
          echo "Release signing certificate: $fp" >> "$GITHUB_STEP_SUMMARY"
