name: Webapp checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run broker-profile and PSX-fee regression tests
        run: npx vitest run src/store/__tests__/createWorkbookStore.test.ts src/lib/calc/__tests__/psxFees.test.ts
      - name: Run full test suite
        run: npm test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run build
