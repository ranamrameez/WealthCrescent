name: Temporary branch validation

on:
  push:
    branches: ["feat/entity-parity-bank-pl"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install
        working-directory: webapp
        run: npm ci
      - name: Build
        working-directory: webapp
        run: npm run build
      - name: Test
        continue-on-error: true
        working-directory: webapp
        run: npm test
